# Project-wide Gradle settings.
# The build JVM's heap holds assembleDebug, the unit tests, coverage and lint
# in one run (the image's warm step, CI's stages), with an explicit metaspace
# bound. The Kotlin daemon, with no kotlin.daemon.jvmargs, inherits these.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

# Concurrent work items, so peak heap does not follow the host's core count
# (Gradle defaults this to every core). 4 is the core count of a GitHub-hosted
# ubuntu-latest runner, where CI runs every job.
org.gradle.workers.max=4

# AndroidX package structure
android.useAndroidX=true

# Kotlin code style
kotlin.code.style=official

# Non-transitive R class for smaller APK
android.nonTransitiveRClass=true

# Enable parallel builds
org.gradle.parallel=true

# Enable configuration cache
org.gradle.configuration-cache=true

# Enable build cache
org.gradle.caching=true

# Suppress library constraints warning
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false

# AGP 9.0 compatibility settings (will be removed in AGP 10.0)
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false
