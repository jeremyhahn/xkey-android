[versions]
# Android Gradle Plugin
agp = "9.5.1"

# Kotlin
kotlin = "2.4.21"

# AndroidX
coreKtx = "1.19.1"
appcompat = "1.8.0"
activity = "1.13.0"
fragment = "1.9.1"
lifecycle = "2.11.0"
securityCrypto = "1.1.0"
biometric = "1.4.0-beta01"
datastore = "1.3.0"
room = "2.8.5"
credentials = "1.6.0"

# Material Design
material = "1.14.0"

# Networking
okhttp = "5.5.1"

# Coroutines
coroutines = "1.11.0"

# BouncyCastle
bouncycastle = "1.86"

# Argon2
argon2 = "13.1"

# QR Code
zxingCore = "3.5.4"

# ML Kit & CameraX
mlkitBarcode = "17.3.0"
camerax = "1.6.2"

# Media3
media3 = "1.11.1"

# ExifInterface
exifinterface = "1.4.2"

# Testing
json = "20260814"
junit = "4.13.2"
junitExt = "1.3.0"
espresso = "3.7.0"
testRules = "1.7.0"
mockk = "1.14.11"
uiautomator = "2.4.1"

# Coverage: the JaCoCo plugin's tool and AGP's coverage instrumentation
jacoco = "0.8.16"

# Build tooling: fixed releases of jars the Android Gradle plugin pulls in
# (constraints in build.gradle.kts; Bouncy Castle uses bouncycastle above)
jose4j = "0.9.6"
jdom2 = "2.0.6.1"
# Guava's two flavours of one release: -jre for build tooling, -android for the app
guavaJre = "33.7.2-jre"
guavaAndroid = "33.7.2-android"

[libraries]
# AndroidX Core
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "activity" }
androidx-fragment-ktx = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "fragment" }

# Lifecycle
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-lifecycle-service = { group = "androidx.lifecycle", name = "lifecycle-service", version.ref = "lifecycle" }

# Security
androidx-security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "securityCrypto" }
androidx-biometric = { group = "androidx.biometric", name = "biometric", version.ref = "biometric" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# Room Database
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
# Room's processor reads Kotlin metadata with kotlin-metadata-jvm, which only
# reads metadata up to one minor past its own version; kapt gets the compiler's.
kotlin-metadata-jvm = { group = "org.jetbrains.kotlin", name = "kotlin-metadata-jvm", version.ref = "kotlin" }

# Credentials (Android 14+ CredentialProvider)
androidx-credentials = { group = "androidx.credentials", name = "credentials", version.ref = "credentials" }

# Material Design
material = { group = "com.google.android.material", name = "material", version.ref = "material" }

# Networking
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }

# Coroutines
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }

# BouncyCastle
bouncycastle-bcprov = { group = "org.bouncycastle", name = "bcprov-jdk18on", version.ref = "bouncycastle" }
bouncycastle-bcpkix = { group = "org.bouncycastle", name = "bcpkix-jdk18on", version.ref = "bouncycastle" }
bouncycastle-bcutil = { group = "org.bouncycastle", name = "bcutil-jdk18on", version.ref = "bouncycastle" }

# Build tooling: constraints only, never declared as a dependency
jose4j = { group = "org.bitbucket.b_c", name = "jose4j", version.ref = "jose4j" }
jdom2 = { group = "org.jdom", name = "jdom2", version.ref = "jdom2" }
guava-jre = { group = "com.google.guava", name = "guava", version.ref = "guavaJre" }
guava-android = { group = "com.google.guava", name = "guava", version.ref = "guavaAndroid" }

# Argon2
argon2 = { group = "org.signal", name = "argon2", version.ref = "argon2" }

# QR Code
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxingCore" }

# ML Kit Barcode
mlkit-barcode = { group = "com.google.mlkit", name = "barcode-scanning", version.ref = "mlkitBarcode" }

# CameraX
camerax-core = { group = "androidx.camera", name = "camera-core", version.ref = "camerax" }
camerax-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
camerax-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
camerax-view = { group = "androidx.camera", name = "camera-view", version.ref = "camerax" }

# Media3
media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }

# ExifInterface
androidx-exifinterface = { group = "androidx.exifinterface", name = "exifinterface", version.ref = "exifinterface" }

# Testing
json = { group = "org.json", name = "json", version.ref = "json" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitExt" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
androidx-espresso-intents = { group = "androidx.test.espresso", name = "espresso-intents", version.ref = "espresso" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
mockk-android = { group = "io.mockk", name = "mockk-android", version.ref = "mockk" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
androidx-test-uiautomator = { group = "androidx.test.uiautomator", name = "uiautomator", version.ref = "uiautomator" }
androidx-test-rules = { group = "androidx.test", name = "rules", version.ref = "testRules" }

[bundles]
lifecycle = [
    "androidx-lifecycle-runtime-ktx",
    "androidx-lifecycle-viewmodel-ktx",
    "androidx-lifecycle-service"
]
coroutines = [
    "kotlinx-coroutines-android",
    "kotlinx-coroutines-core"
]
testing = [
    "json",
    "junit",
    "mockk",
    "kotlinx-coroutines-test"
]
androidTesting = [
    "androidx-junit",
    "androidx-espresso-core",
    "androidx-espresso-intents",
    "androidx-test-rules",
    "mockk-android"
]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
