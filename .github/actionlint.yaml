# Self-hosted runner labels for actionlint.
#
# Jobs run on GitHub-hosted ubuntu-latest, which actionlint knows, except:
# - the code-review.yml review jobs, which run on the self-hosted `codex` and
#   `qwen` runners;
# - the ci.yml jobs that read preflight's runner outputs, and code-review.yml's
#   scope job, which take the self-hosted bigdisk pool for a same-repository
#   head once its repository variables are set: the label sets
#   [self-hosted, linux, x64, bigdisk] and [self-hosted, linux, x64,
#   bigdisk-docker] (self-hosted, linux and x64 are actionlint built-ins).
# Without this file actionlint reports those labels as unknown runners
# (runner-label); with it, a misspelled label is still caught. Adding a
# self-hosted label to a workflow means adding it here in the same change.
self-hosted-runner:
  labels:
    - bigdisk
    - bigdisk-docker
    - codex
    - qwen
paths:
  # code-review.yml is a template copied verbatim; SC2015 there is informational.
  .github/workflows/code-review.yml:
    ignore:
      - 'SC2015:'
