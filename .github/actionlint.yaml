# Self-hosted runner labels for actionlint.
#
# Every job runs on GitHub-hosted ubuntu-latest, which actionlint knows,
# except the code-review.yml review job, which runs on the self-hosted `codex`
# runner. Without this file actionlint reports that label as an unknown
# runner (runner-label); with it, a misspelled label is still caught. Adding
# a self-hosted label to a workflow means adding it here in the same change.
self-hosted-runner:
  labels:
    - codex
