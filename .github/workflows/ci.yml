# ci-template: v1.15 (adapted: Kotlin/Gradle Android app, not a Go module)
#
# The canonical CI workflow (automatethethings software/templates/github-actions/
# ci.yml) adapted to this repository's stack. The template's structure is kept:
# one workflow for both hosts (handbook devops.md section 1), every job runs a
# `make` target (section 4), every job starting at once (v1.14: no job waits
# on lint + build), and ONE aggregate `CI Gate` job that branch protection
# requires. `push` runs on main only (v1.15).
#
# What the Go template has that this repo deliberately does NOT:
#   - gofmt / go vet / golangci-lint / gosec / govulncheck / go mod verify:
#     there is no Go code here. Their Android-side counterparts are Android
#     lint (Lint job) and trivy fs (Security job).
#   - coverage threshold: the JaCoCo report exists (`./gradlew coverageReport`)
#     but no threshold has been ratified for this app; adding one is a product
#     decision, not CI wiring.
#   - instrumented tests (`make integration-test`, connectedDebugAndroidTest):
#     they need a booted emulator or device. The Gitea job containers have no
#     KVM, and the Keystore/StrongBox/attestation suites depend on real
#     device Keystore behaviour, so they stay local (#7 Tier 3).
#
# Taken ahead of the rest of the template (#35, Company Agent m967 (2)):
#   - the v1.25 `concurrency:` block (devops.md section 9b): a newer push to a
#     PR cancels that PR's older run, and on main one group per event, so a
#     newer push to main cancels the older main push run;
#   - the v1.24 docs-only filter (ci-standard.md section 10 (a)): the
#     `changes` job, and a PR whose every changed file matches
#     DOCS_ONLY_PATTERN runs Lint alone, Build, Test and Security skip.
#
# Gitea constraints honoured (devops.md section 1): no `join(needs.*.result)`
# in the gate, single-quoted expression strings, `runs-on: ubuntu-latest` only (gate: `ci-gate` on Gitea, `ubuntu-latest` on the GitHub mirror, #36),
# upload-artifact guarded to github.com, a literal `cancel-in-progress: true`
# (section 9b).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # CUSTOMIZE (xkey-android): no `labeled` (DS-3134, gtp #853). Gitea 1.27.1
    # sends every label add AND remove as `label_updated`, and its matcher
    # maps that to `labeled` whichever label moved, with no
    # `github.event.label` in the payload. Each `task:*` or `code-review`
    # change then started a run that the `concurrency` block let cancel the
    # PR's run in progress, and a run whose jobs an `if:` skips would post
    # `skipped` over the real run's `CI / *` contexts, CI Gate included. An
    # action outside `types` matches nothing: no run, no status. The cost:
    # adding `ci:full` waits for the PR's next push, or takes effect through
    # `workflow_dispatch`.
    # (#35, Codex 6491) Until then a docs-only PR keeps its last run's green
    # CI Gate, with Build, Test and Security skipped. To validate it in full
    # before merge, push to the PR or dispatch this workflow on its branch:
    # a workflow_dispatch run is never docs-only.
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

# CUSTOMIZE (xkey-android): ci-template v1.25's block, ahead of the template
# (#35, Company Agent m967 (2)). On main the group is the workflow and the
# event, so a push to main cancels the in-progress main push run of an older
# commit, and a workflow_dispatch run cancels only an older dispatch run.
# Every other ref is one group, so a PR's newer run cancels the older. No
# expression reaches cancel-in-progress (devops.md section 9b): Gitea 1.27.1
# never released a run once it was set to an expression.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && format('main-{0}', github.event_name) || github.ref }}
  cancel-in-progress: true

env:
  # The Gradle daemon toolchain this project pins in
  # gradle/gradle-daemon-jvm.properties (toolchainVendor=JETBRAINS,
  # toolchainVersion=21). Running the launcher on that same JDK means Gradle
  # does not provision a second JDK through foojay on every run. The app
  # itself compiles to Java/Kotlin target 17 (app/build.gradle.kts).
  JAVA_DISTRIBUTION: jetbrains
  JAVA_VERSION: '21'
  # compileSdk 34 (app/build.gradle.kts); build-tools 36.0.0 is AGP 9.0's
  # default. The repo's Dockerfile pins JDK 17 + build-tools 34, which no
  # longer matches the Gradle 9.1 / AGP 9.0 toolchain, so CI provisions the
  # SDK directly instead of building that image.
  ANDROID_PACKAGES: 'platform-tools platforms;android-34 build-tools;36.0.0'
  # Read by the Makefile (`GRADLEW ?= ./gradlew`), so CI and a developer run
  # the same targets; CI only makes the output log-friendly.
  GRADLEW: ./gradlew --no-daemon --console=plain --stacktrace
  # Gradle dependency cache via setup-java, on github.com only. On Gitea the
  # Actions cache service is unreachable from job containers (infra/gitea
  # docs/lessons.md, "Workflow differences"): the restore fails with
  # ECONNREFUSED and the save step retries it, so it costs time and buys
  # nothing. An empty `cache:` disables it.
  GRADLE_CACHE: ${{ github.server_url == 'https://github.com' && 'gradle' || '' }}
  # CUSTOMIZE (xkey-android): ci-template v1.24's docs-only filter, ahead of
  # the template (#35). The files a docs-only PR may touch.
  DOCS_ONLY_PATTERN: '(\.md$|^docs/)'

jobs:
  # CUSTOMIZE (xkey-android): ci-template v1.24's `changes` job (ci-standard.md
  # section 10 (a)). A PR whose every changed file matches DOCS_ONLY_PATTERN
  # runs Lint only; Build, Test and Security skip and CI Gate reads them as
  # passed. Off pull_request, or on a PR labelled ci:full, docs_only is always
  # false. CI_FULL reads the labels the PR carried when its run started, and
  # no label change starts a run (see `pull_request:` above): ci:full takes
  # effect at the PR's next push, or at a workflow_dispatch on the PR's
  # branch, and until then the last run's result stands. Any doubt (a failed diff, an empty list) reads as false, so the
  # filter fails toward running the tests. Lint does not wait on this job.
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
    env:
      CI_FULL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') }}
    steps:
      - uses: actions/checkout@v6
        if: ${{ github.event_name == 'pull_request' && env.CI_FULL != 'true' }}
        with:
          fetch-depth: 0
      - name: Is every changed file docs or markdown?
        id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          docs_only=false
          if [ "$EVENT" = pull_request ] && [ "$CI_FULL" != true ]; then
            if files=$(git diff --name-only --no-renames "$BASE...$HEAD") && [ -n "$files" ]; then
              if ! printf '%s\n' "$files" | grep -qvE "$DOCS_ONLY_PATTERN"; then
                docs_only=true
              fi
              printf '%s\n' "$files"
            fi
          fi
          echo "docs only: $docs_only"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: ${{ env.GRADLE_CACHE }}

      - uses: android-actions/setup-android@v3
        with:
          packages: ${{ env.ANDROID_PACKAGES }}
          log-accepted-android-sdk-licenses: false

      # actionlint and shellcheck are baked into the Gitea ci-runner image
      # (infra/gitea/ci-runner). The fallback install only runs where the image
      # is absent (the GitHub mirror) and is pinned to the image's version.
      # `make actionlint` refuses to run without shellcheck, because actionlint
      # silently disables every SC rule and exits 0 when it is missing.
      - name: Provide actionlint
        env:
          ACTIONLINT_VERSION: '1.7.7'   # keep in step with ci-runner versions.conf
        run: |
          set -eu
          if command -v actionlint > /dev/null 2>&1; then
            echo "using the image's actionlint: $(command -v actionlint)"
          else
            echo "actionlint absent (expected on the GitHub mirror, NOT on ci-runner)"
            ok=0
            for i in 1 2 3; do
              if go install "github.com/rhysd/actionlint/cmd/actionlint@v${ACTIONLINT_VERSION}"; then ok=1; break; fi
              echo "install attempt $i failed; retrying"; sleep 10
            done
            [ "$ok" = 1 ] || { echo "actionlint install failed after 3 attempts"; exit 1; }
            echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          fi

      # Android lint (lintDebug, abortOnError) + actionlint over .github/workflows.
      - name: Lint
        run: make lint

      - name: Upload lint report
        if: always() && github.server_url == 'https://github.com'
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: changes             # v1.24: skips on a docs-only PR
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: ${{ env.GRADLE_CACHE }}

      - uses: android-actions/setup-android@v3
        with:
          packages: ${{ env.ANDROID_PACKAGES }}
          log-accepted-android-sdk-licenses: false

      # Debug APK only. Release builds need signing credentials, which CI is
      # deliberately not given (assembleRelease refuses to emit an unsigned APK).
      - name: Build debug APK
        run: make build

  test:
    name: Test
    runs-on: ubuntu-latest
    # v1.14: no job waits on lint + build; CI Gate fails closed on any of
    # them. v1.24: it waits on `changes` alone and skips on a docs-only PR.
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: ${{ env.GRADLE_CACHE }}

      - uses: android-actions/setup-android@v3
        with:
          packages: ${{ env.ANDROID_PACKAGES }}
          log-accepted-android-sdk-licenses: false

      # JVM unit tests (testDebugUnitTest), including the wire-compatibility
      # vector suites. No device needed.
      - name: Unit tests
        run: make test

      - name: Upload test report
        if: always() && github.server_url == 'https://github.com'
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

  security:
    name: Security
    runs-on: ubuntu-latest
    # v1.14: starts with lint and build, not after them. v1.24: it waits on
    # `changes` alone and skips on a docs-only PR.
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      # Pinned (.trivy-version), checksum-verified trivy from the release
      # tarball: the same installer `make install-tools` uses, on both hosts,
      # so the CI scanner and a developer's scanner are the same binary.
      - name: Install trivy
        run: |
          ./scripts/install-trivy.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # trivy fs, vuln + secret, blocking on CRITICAL/HIGH (devops.md
      # section 8; kept blocking in alpha as section 8a allows while green).
      # Note: trivy's Gradle analyzer reads gradle.lockfile only, and this
      # repo does not use dependency locking, so today the vuln scanner finds
      # no manifest and this job is effectively the secret scan.
      - name: Security scan
        run: make security

  # THE required check. Reads every job result BY NAME and fails closed:
  # `join(needs.*.result)` is the empty string on Gitea (devops.md section 1),
  # so a gate built on it passes while jobs fail. Adding a job means adding it
  # to `needs` AND to the check lines below.
  gate:
    name: CI Gate
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'ci-gate' }}
    if: always()
    needs: [changes, lint, build, test, security]
    steps:
      - name: Fail closed on any non-success
        env:
          # CUSTOMIZE (xkey-android): v1.24's docs-only skip. A job marked
          # `code` may be skipped only when `changes` succeeded and said
          # docs_only; a `pr` job may never be skipped, and a failed
          # `changes` fails the gate.
          DOCS_ONLY: ${{ needs.changes.result == 'success' && needs.changes.outputs.docs_only == 'true' }}
        run: |
          BAD=0
          echo "docs-only PR: ${DOCS_ONLY}"
          check() { # <job> <result> <pr|code>
            case "$2" in
              success) echo "OK   $1";;
              skipped)
                if [ "$3" = code ] && [ "${DOCS_ONLY}" = true ]; then
                  echo "SKIP $1 (docs-only PR)"
                else
                  echo "FAIL $1 (skipped)"; BAD=1
                fi;;
              *) echo "FAIL $1 ($2)"; BAD=1;;
            esac
          }
          check changes  "${{ needs.changes.result }}" pr
          check lint     "${{ needs.lint.result }}" pr
          check build    "${{ needs.build.result }}" code
          check test     "${{ needs.test.result }}" code
          check security "${{ needs.security.result }}" code
          exit $BAD
