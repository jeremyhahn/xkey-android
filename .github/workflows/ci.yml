# CI for a Kotlin/Gradle Android app. Every stage runs a make target inside
# this repository's devcontainer images (build/docker/devcontainer), so CI and
# a developer's machine run the same tools at the same pinned versions; no
# step installs a toolchain on the runner.
#
# Runners. Every job runs on GitHub-hosted ubuntu-latest (4 cores, 16 GB RAM,
# about 14 GB free on /, 6-hour job limit). Each job that builds an image
# first frees the disk the runner's preinstalled toolchains hold, and Gradle
# runs at most 4 workers (gradle.properties). Every job fits one runner, so
# none is sharded. Each run gets fresh runners whose Docker daemon no other
# job shares, so no job leases, locks or reaps images.
#
# Tiers. A pull request runs the PR tier: lint, deps-check, build and the unit
# suite with coverage (the image job), the repository's own gates
# (lint-gates) and the changed-files detection with the architecture gate
# (preflight). The full tier adds
# integration, security and `trivy image`; it runs on a push to main, on
# workflow_dispatch and on a PR labelled ci:full.
# Soak runs on workflow_dispatch only. A draft PR runs no
# CI, and CI Gate fails on a draft. A PR whose every changed file matches
# DOCS_ONLY_PATTERN runs lint alone.
#
# CI Gate is the one required check. It needs every job and fails closed on
# any result but success, naming a skipped job apart from a failed one. Every
# job starts at once, so a run takes as long as its slowest job.
#
# Concurrency. A newer push to a PR cancels that PR's older run. On main each
# event and commit is its own group, so every merge keeps its run and a
# dispatch run never cancels a push run. cancel-in-progress is a
# literal `true`: an expression there once left a main run queued with no
# task.
#
# Integration image tag. The integration image is <repo>-ci-it:<hash>
# (`make -s it-image`): a hash of the tree and of the base image's package
# index (APT_INDEX_SUM from scripts/apt-index-sum.sh; APK_INDEX_SUM is the
# constant `none`, since the base is Debian). Without the index sum, a tree
# whose files had not changed kept its cached image after the distribution
# shipped a fix, and `trivy image` stayed red on a fixed CVE until an
# unrelated file moved. The Dockerfile's `integration` stage takes the sum as
# a build argument and runs `apt-get upgrade` after it, so a new package
# release changes the tag and rebuilds with the fixed package. An index the
# script cannot read fails the job: a missing index is never a pass.
# scripts/image-tag-test.sh (lint-gates) tests the tag hashing.
#
# Other rules this file keeps:
#   - The jobs that use forge credentials mask them first, and no step or make
#     target prints an env file, the job environment or a matched line.
#   - lint-gates runs `make lint-gates` without `-k`, so the first failing
#     gate ends the step instead of the rest running on after it.
#   - actionlint runs with shellcheck on PATH; without it actionlint silently
#     skips its SC* rules and exits 0. .github/actionlint.yaml lists the
#     self-hosted runner labels a workflow may name.
#   - `trivy image` takes --ignore-unfixed: a fixed CVE blocks, an advisory
#     with no fixed package does not.
#   - Third-party actions are pinned by commit, with the tag in a trailing
#     comment.
#   - Triggers name main only: the trunk is main, and a second trunk would run
#     every commit twice.
#   - workflow_dispatch lets a run that died for an infrastructure reason be
#     retried without an empty commit.
#   - There is no race job and no FIPS job: the repository has no Go code.

name: CI

on:
  push:
    # Trunk-based: main is the only trunk.
    branches: [main]
  pull_request:
    branches: [main]
    # No `labeled`: a label change would start a run that the `concurrency`
    # block lets cancel the PR's run in progress, and a run whose jobs an
    # `if:` skips posts `skipped` over the real run's `CI / *` contexts, CI
    # Gate included. The cost: adding `ci:full` takes effect at the PR's next
    # push, or through `workflow_dispatch`.
    # Until then a docs-only PR keeps its last run's green CI Gate, with
    # build, test and security skipped. To validate it in full before merge,
    # push to the PR or dispatch this workflow on its branch: a
    # workflow_dispatch run is never docs-only.
    types: [opened, synchronize, reopened]
  workflow_dispatch:                    # re-fire a whole workflow; also the
                                        # only retry when a run was never
                                        # created

# On main the group is the event and the commit, so a newer push to main never
# cancels an older main run (every merge keeps its run) and a
# workflow_dispatch run never cancels a push run. Every other ref is one
# group, so a PR's newer run cancels the older. No expression reaches
# cancel-in-progress: a run after it was set to an expression was never
# released.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && format('main-{0}-{1}', github.event_name, github.sha) || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # No coverage threshold is set for this app (a product decision, not CI
  # wiring), so the variable stays and is empty: `make coverage` runs the unit
  # suite and writes the JaCoCo report, enforces no number, and refuses a
  # non-empty value rather than ignore it.
  COVERAGE_THRESHOLD: ''
  # Gradle has no build tags; the variants are AGP build types, and CI builds
  # and tests debug.
  # The full tier: every event but pull_request (push to main,
  # workflow_dispatch), and a PR labelled ci:full.
  # Steps read it as env.CI_FULL_TIER; a job-level `if:` cannot read env, so
  # the integration job repeats this expression. Keep them equal.
  CI_FULL_TIER: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full') }}
  # The files a docs-only PR may touch. Narrow it if the build ever embeds or
  # generates from docs/.
  DOCS_ONLY_PATTERN: '(\.md$|^docs/)'
  # The repository's releasability test, which a docs-only PR still runs
  # because make coverage skips on it: a make target name. Empty: this repository has no such test, so the hook
  # and its docs-only step stay and run nothing.
  RELEASABILITY_TEST: ""
  # The devcontainer images' names and fresh trusted builds. A push to main and a
  # dispatch on main are trusted; every other run is pr. Both come
  # from the event and the ref, never from a name a PR picks, and every make
  # call reads them from here. IMAGE_NAMESPACE is a name only (trusted tags
  # <hash>, pr tags pr-<hash>; image-tag.sh) and protects nothing: a Docker
  # daemon may serve pull request runs and main's alike, and a pull request's
  # run executes its own Makefile, so it can write any tag.
  # IMAGE_FRESH is the guard: a trusted run builds every image it uses from
  # its own inputs, with no tag reuse and no build cache, and runs each by the
  # ID its build wrote (Makefile IMAGE_FRESH; scripts/in-toolchain-image.sh
  # refuses a tag). A pr run reuses images by tag; it can only fool itself.
  IMAGE_NAMESPACE: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && 'trusted' || 'pr' }}
  IMAGE_FRESH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && 'true' || 'false' }}

jobs:
  # A PR whose every changed file matches DOCS_ONLY_PATTERN runs lint only; build and make coverage are skipped. Off pull_request, or
  # on a ci:full PR, docs_only is always false. Any doubt (a failed diff, an
  # empty list) reads as false, so the tier fails toward running the tests.
  # Preflight: the changed-files detection the image job reads (docs_only),
  # then the architecture gate, the repository's layering rules as source
  # checks with grep on the runner's shell, not a stage. Lint-class checks,
  # so the job stays on the PR tier.
  preflight:
    name: Preflight [changed files, architecture gates]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
    # A draft PR runs no CI; the image job needs this one and skips with it.
    if: ${{ !github.event.pull_request.draft }}
    steps:
      # One checkout for every step: the diff step needs the history on a PR
      # run, and the source checks need the tree on every event.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - name: Is every changed file docs or markdown?
        id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          docs_only=false
          if [ "$EVENT" = pull_request ] && [ "$CI_FULL_TIER" != true ]; then
            if files=$(git diff --name-only --no-renames "$BASE...$HEAD") && [ -n "$files" ]; then
              if ! printf '%s\n' "$files" | grep -qvE "$DOCS_ONLY_PATTERN"; then
                docs_only=true
              fi
              printf '%s\n' "$files"
            fi
          fi
          echo "docs only: $docs_only"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

      # Coroutines for async work, never blocking (CLAUDE.md), so runBlocking is
      # banned from production sources (tests may use it).
      - name: No runBlocking in production sources
        run: |
          hits=$(grep -rn --include='*.kt' --include='*.java' -E '\brunBlocking\b' app/src/main || true)
          if [ -n "$hits" ]; then
            echo "runBlocking blocks its thread; use a coroutine scope (CLAUDE.md: no blocking):"
            echo "$hits"; exit 1
          fi
          echo "OK: no runBlocking in app/src/main"

  # Every stage runs in the project's own devcontainer image and no other. One
  # image job builds the images once from build/docker/devcontainer/Dockerfile
  # at this commit (`make docker-build`) and runs each stage's `make` target in
  # the toolchain image as its own step, through scripts/in-toolchain-image.sh,
  # which copies the checkout into the container: a runner reaches its daemon
  # through a socket, so a bind mount would resolve on the daemon's host. A
  # failed step names its stage; `if: !cancelled()` runs every stage after a
  # failed one, so one run reports them all.
  #
  # No job installs a toolchain or a tool on the runner: the image's pin file
  # (scripts/tool-pins.sh) decides every version, and the Makefile carries
  # every flag set, so CI runs the developers' targets. build, test and lint
  # run with no network, on the image's dependency cache; security and
  # deps-check get one (IN_IMAGE_NETWORK=bridge) for the vulnerability
  # databases and the dependency repositories.
  #
  # lint, deps-check, build and coverage are the PR tier and run on every
  # event. security and trivy image are full tier only (env.CI_FULL_TIER):
  # main after every merge, dispatch, ci:full.
  #
  # The job reads the base image's package index into APT_INDEX_SUM, which
  # the integration image's tag hashes and its build takes as a build
  # argument. A new package release, a CVE fix among them, changes the tag,
  # so the next run rebuilds the image rather than reuse a cached one with
  # the old package.
  #
  # No step and no make target prints a credential, the job environment
  # (`env`, `printenv`, `set -x`) or a matched line: lint steps and `make
  # check-public-literals` report path and line only.
  #
  # Runner: GitHub-hosted ubuntu-latest, which has Docker. The cold image
  # builds (no layer cache survives a run) and the stages fit 150 minutes.
  image:
    name: Devcontainer image [lint, build, test, security, deps-check, trivy image]
    runs-on: ubuntu-latest
    needs: preflight
    timeout-minutes: 150      # two cold image builds and every stage on 4 cores
    env:
      CI_STACK_PREFIX: ${{ github.event.repository.name }}-ci-
      # The cache volumes' trust class. Only a push to main writes the caches
      # main's build reads; every other event, pull requests included, gets
      # the `pr` set.
      CI_CACHE_CLASS: ${{ github.event_name == 'push' && 'main' || 'pr' }}
      # No cache volumes. Gradle reads every dependency from the image's read-only cache
      # (GRADLE_RO_DEP_CACHE) and each stage gets a fresh, writable Gradle home
      # that goes with its container (scripts/in-toolchain-image.sh), so no cache outlives a stage and trim-ci-caches.sh finds none.
      CI_CACHE: 'off'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # Mask the forge credentials before any other step. A runner that injects
      # them does so as plain environment, which the log does not mask by itself,
      # and the token sits inside GIT_CONFIG_KEY_0's URL, so it is masked alone
      # as well.
      - name: Mask the forge credentials
        run: |
          for v in GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            val=${!v:-}
            [ -n "$val" ] || continue
            echo "::add-mask::$val"
            case $val in *://*:*@*) t=${val#*://}; t=${t%%@*}; echo "::add-mask::${t#*:}" ;; esac
          done

      # A hosted runner is a fresh VM per job, so nothing removed here is
      # shared. The host's .NET, Android SDK and GHC go (the stages use the
      # images' own JDK and SDK), and the preloaded images with them.
      - name: Free runner disk
        if: ${{ runner.environment == 'github-hosted' }}
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          docker image prune --all --force
          df -h /

      # The integration image is named by its content, <repo>-ci-it:<hash>
      # (`make -s it-image`), so every job names the same image for the same
      # tree. An Alpine package index checksum joins the tag hash
      # (scripts/apk-index-sum.sh); a base image the script cannot read fails
      # the step. The Dockerfile's FROM names ${BASE_IMAGE},
      # which has no global ARG default, so APK_BASE_IMAGES is the base
      # scripts/tool-pins.sh pins. It is Debian, so the sum is `none`.
      - name: Read the Alpine package index
        run: |
          APK_BASE_IMAGES=$(. scripts/tool-pins.sh && printf '%s' "$BASE_IMAGE")
          export APK_BASE_IMAGES
          sum=$(scripts/apk-index-sum.sh)
          echo "APK_INDEX_SUM=$sum" >> "$GITHUB_ENV"

      # The Debian mirror of the step above, whose sum is `none` on this base.
      # scripts/apt-index-sum.sh hashes the pinned BASE_IMAGE's apt index
      # into APT_INDEX_SUM, which the integration tag hashes and whose build
      # runs `apt-get upgrade` again. An unreadable index fails the job.
      - name: Read the Debian package index
        run: |
          sum=$(scripts/apt-index-sum.sh)
          echo "APT_INDEX_SUM=$sum" >> "$GITHUB_ENV"

      - name: Name the integration image
        run: echo "IT_IMAGE=$(make -s it-image)" >> "$GITHUB_ENV"

      # Host tuning a test needs goes here; the container shares the runner's
      # kernel.

      # No build secret. The image's Gradle
      # dependencies come from public Maven repositories, so no forge
      # credential is written to a file or reaches the build.
      # Every later step runs the images by ID: on a trusted run the IDs the fresh builds wrote,
      # else the IDs the tags name now. TOOLCHAIN_IMAGE and IT_IMAGE hold the
      # IDs from here on.
      - name: Build the devcontainer images
        env:
          IMAGE_ID_DIR: ${{ runner.temp }}/image-ids
        run: |
          make docker-build IT_IMAGE="$IT_IMAGE"
          tc=$(make -s toolchain-image-id)
          it=$(make -s it-image-id IT_IMAGE="$IT_IMAGE")
          echo "toolchain image $(make -s toolchain-image) = $tc; integration image $IT_IMAGE = $it"
          { echo "TOOLCHAIN_IMAGE=$tc"; echo "IT_IMAGE=$it"; } >> "$GITHUB_ENV"

      # Bound this repo's cache volumes on the host before the stages add to
      # them. It never fails the job.
      - name: Trim the CI caches
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' }}
        run: scripts/trim-ci-caches.sh "$CI_STACK_PREFIX" "$TOOLCHAIN_IMAGE"

      # make lint is Android lint (lintDebug, abortOnError) and actionlint with
      # shellcheck.
      - name: make lint
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' }}
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" "make lint"
      # The repository's own gates (make lint-gates) run in the
      # lint-gates job beside this one, never here and never as a prerequisite
      # of lint.

      # A docs-only PR skips make coverage, so it runs the releasability test
      # alone; any other run gets it from make coverage. RELEASABILITY_TEST
      # names a make target; it is empty here (no such test), so this step is skipped.
      - name: Releasability test (docs-only PR)
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' && env.RELEASABILITY_TEST != '' && needs.preflight.outputs.docs_only == 'true' }}
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" "make $RELEASABILITY_TEST"

      # make build is the debug APK (assembleDebug).
      # A release build needs signing credentials, which CI is not given.
      - name: make build
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' && needs.preflight.outputs.docs_only != 'true' }}
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" "make build"

      # The test stage: make coverage is the JVM unit suite (testDebugUnitTest,
      # the wire-compatibility vectors included) and its JaCoCo report, so the
      # suite runs once. There is no threshold (COVERAGE_THRESHOLD above). The
      # integration stage is its own job below.
      - name: make coverage (unit tests and the threshold)
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' && needs.preflight.outputs.docs_only != 'true' }}
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" "make coverage COVERAGE_THRESHOLD=$COVERAGE_THRESHOLD"

      # make security is trivy fs, vuln and secret, blocking on CRITICAL/HIGH,
      # over the repo and build/docker.
      - name: make security
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' && env.CI_FULL_TIER == 'true' }}
        env:
          IN_IMAGE_NETWORK: bridge
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" "make security"

      # Fails when a library, first-party or third-party, is behind its latest
      # release without a documented reason. A lint-class gate of seconds on
      # the PR tier, every event, a docs-only PR included, so a dependency
      # behind its floor fails the PR, not main after the merge.
      - name: make deps-check
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' }}
        env:
          IN_IMAGE_NETWORK: bridge
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" make deps-check

      # The integration image is scanned with --ignore-unfixed; trivy fs and
      # make security never take it. A PR builds no image for a registry, so
      # the scan is full tier. The jars in the image's Gradle cache are
      # scanned. trivy's cache (--cache-dir) and temp files (TMPDIR) go under
      # /src, the stage container's writable layer on the host's disk: those
      # jars need the Java DB, whose download and extraction overflow the
      # container's 3 GiB /tmp.
      - name: trivy image (integration image)
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' && env.CI_FULL_TIER == 'true' }}
        env:
          IN_IMAGE_NETWORK: bridge
        run: |
          docker save -o it-image.tar "$IT_IMAGE"
          scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" \
            "mkdir -p /src/.trivy/tmp && TMPDIR=/src/.trivy/tmp trivy image --cache-dir /src/.trivy/cache --input it-image.tar --ignore-unfixed --severity CRITICAL,HIGH --exit-code 1"

      - name: Tear down
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/gomodauth.env" it-image.tar
          rm -rf "$RUNNER_TEMP/image-ids"

  # The repository's own gates run
  # in this job, in parallel with the image job's `make lint`, not in series
  # after it, so Lint's wall time is the longer of the two and not their sum.
  # `make lint-gates` is actionlint over .github/workflows and the gate
  # tests for the workflow scripts (closing links, revert-red-main, the
  # reaper, deps-check); `make lint` is Android lint alone, so no gate runs
  # twice. A lint-class check: it is on the PR tier and runs on a docs-only PR.
  # The job needs only the toolchain image,
  # which `make docker-build-toolchain` builds or reuses (the integration image
  # is the image job's), and it runs that image by ID as the image job does.
  # The gates are offline (stubbed docker, a stubbed forge API and a local
  # remote; fixtures),
  # so IN_IMAGE_NETWORK stays none. Needs in the toolchain image: actionlint
  # and shellcheck (the Dockerfile's pinned actionlint and apt shellcheck),
  # bash, git, jq and make. No gate needs python3.
  # The step fails fast. `make
  # lint-gates` runs without `-k`, so the first failing gate ends the step
  # and the job; the gates after it run on the next push.
  lint-gates:
    name: Lint Gates [toolchain image]
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}
    timeout-minutes: 75       # a cold toolchain image build, then gates of minutes
    env:
      CI_STACK_PREFIX: ${{ github.event.repository.name }}-ci-
      # The cache volumes' trust class (as in the image job).
      CI_CACHE_CLASS: ${{ github.event_name == 'push' && 'main' || 'pr' }}
      CI_CACHE: 'off'         # as in the image job
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # Mask the forge credentials before any other step (as above).
      - name: Mask the forge credentials
        run: |
          for v in GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            val=${!v:-}
            [ -n "$val" ] || continue
            echo "::add-mask::$val"
            case $val in *://*:*@*) t=${val#*://}; t=${t%%@*}; echo "::add-mask::${t#*:}" ;; esac
          done

      # A hosted runner is a fresh VM per job, so nothing removed here is
      # shared. The host's .NET, Android SDK and GHC go (the stages use the
      # images' own JDK and SDK), and the preloaded images with them.
      - name: Free runner disk
        if: ${{ runner.environment == 'github-hosted' }}
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          docker image prune --all --force
          df -h /

      # The toolchain image alone, run by ID (as in the image job).
      - name: Build the toolchain image
        env:
          IMAGE_ID_DIR: ${{ runner.temp }}/image-ids
        run: |
          make docker-build-toolchain
          tc=$(make -s toolchain-image-id)
          echo "toolchain image $(make -s toolchain-image) = $tc"
          echo "TOOLCHAIN_IMAGE=$tc" >> "$GITHUB_ENV"

      # Bound this repo's cache volumes (as in the image job). It never
      # fails the job and keeps every volume a container mounts.
      - name: Trim the CI caches
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' }}
        run: scripts/trim-ci-caches.sh "$CI_STACK_PREFIX" "$TOOLCHAIN_IMAGE"

      # No -k: the first failing gate ends the step.
      - name: make lint-gates
        if: ${{ !cancelled() && env.TOOLCHAIN_IMAGE != '' }}
        env:
          IN_IMAGE_NETWORK: none   # bridge when a gate needs a network; none of these does
        run: scripts/in-toolchain-image.sh "$TOOLCHAIN_IMAGE" "make lint-gates"

      - name: Tear down
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/image-ids"

      # Internal-name gate. Its patterns are internal values, so they are not
      # stored in this repository: the Actions secret RELEASABILITY_PATTERNS
      # carries the pattern file. Blank and `#` lines are skipped; every other
      # line is `class<TAB>regex`, where class is one of coord-host,
      # internal-email, lab-address, lab-host or owner-path (optionally with an
      # `/i` suffix) and regex is a POSIX extended regex. A malformed line, an
      # unknown class or a regex grep -E rejects fails the step, which prints
      # the line number only. A match prints its path and line, never the
      # value. A run without the secret (a fork PR) skips with a notice; a
      # push to main without it fails.
      - name: Releasability (private patterns)
        if: ${{ !cancelled() }}
        env:
          RELEASABILITY_PATTERNS: ${{ secrets.RELEASABILITY_PATTERNS }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ -z "$RELEASABILITY_PATTERNS" ]; then
            if [ "$EVENT" = push ]; then
              echo "::error::RELEASABILITY_PATTERNS is not set; the gate needs the private pattern file"
              exit 1
            fi
            echo "::notice::RELEASABILITY_PATTERNS is not available to this run; pushes to main run the gate"
            exit 0
          fi
          pf=$(mktemp)
          chmod 600 "$pf"
          trap 'rm -f "$pf"' EXIT
          tab=$(printf '\t')
          n=0 bad=0 count=0
          while IFS= read -r line || [ -n "$line" ]; do
            n=$((n + 1))
            line=${line%$'\r'}
            trimmed=${line#"${line%%[![:space:]]*}"}
            case $trimmed in ''|'#'*) continue ;; esac
            case $line in
              *"$tab"*) ;;
              *) echo "::error::pattern line $n is not class<TAB>regex"; bad=1; continue ;;
            esac
            class=${line%%"$tab"*}
            re=${line#*"$tab"}
            case $class in
              coord-host|internal-email|lab-address|lab-host|owner-path) ;;
              coord-host/i|internal-email/i|lab-address/i|lab-host/i|owner-path/i) ;;
              *) echo "::error::pattern line $n has an unknown class"; bad=1; continue ;;
            esac
            if [ -z "$re" ]; then
              echo "::error::pattern line $n has an empty regex"; bad=1; continue
            fi
            rc=0
            grep -E -e "$re" /dev/null > /dev/null 2>&1 || rc=$?
            if [ "$rc" -ge 2 ]; then
              echo "::error::pattern line $n has a regex grep -E refuses"; bad=1; continue
            fi
            printf '%s\n' "$re" >> "$pf"
            count=$((count + 1))
          done <<< "$RELEASABILITY_PATTERNS"
          if [ "$bad" != 0 ]; then
            echo "::error::the private pattern file is malformed (line numbers above; the values are not shown)"
            exit 1
          fi
          if [ "$count" = 0 ]; then
            echo "::error::RELEASABILITY_PATTERNS holds no class<TAB>regex line"
            exit 1
          fi
          rc=0
          hits=$(git grep -n -I -i -E -f "$pf" -- . | cut -d: -f1,2; exit "${PIPESTATUS[0]}") || rc=$?
          case $rc in
            0)
              echo "::error::internal names in the tracked tree (path:line; the values are not shown):"
              printf '%s\n' "$hits"
              exit 1 ;;
            1) ;;
            *)
              echo "::error::git grep failed (rc $rc)"
              exit 1 ;;
          esac
          echo "releasability: $count private patterns, 0 matches"

  # Integration tests run in the integration image, as a
  # compose stack on the runner host started by `make integration-test`. The
  # stack is named per run under the repo's prefix, and the job keeps its own
  # teardown last under `if: always()`.
  # Full tier only (CI_FULL_TIER's expression); never on a plain PR.
  integration:
    name: Integration [integration image]
    # Never on a draft PR, ci:full or not.
    if: ${{ (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full')) && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 120      # a cold integration image build and the JVM suite
    env:
      CI_STACK_PREFIX: ${{ github.event.repository.name }}-ci-
      IT_PROJECT: ${{ github.event.repository.name }}-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # Mask the forge credentials before any other step. A runner that injects
      # them does so as plain environment, which the log does not mask by itself,
      # and the token sits inside GIT_CONFIG_KEY_0's URL, so it is masked alone
      # as well.
      - name: Mask the forge credentials
        run: |
          for v in GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            val=${!v:-}
            [ -n "$val" ] || continue
            echo "::add-mask::$val"
            case $val in *://*:*@*) t=${val#*://}; t=${t%%@*}; echo "::add-mask::${t#*:}" ;; esac
          done

      # A hosted runner is a fresh VM per job, so nothing removed here is
      # shared. The host's .NET, Android SDK and GHC go (the stages use the
      # images' own JDK and SDK), and the preloaded images with them.
      - name: Free runner disk
        if: ${{ runner.environment == 'github-hosted' }}
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          docker image prune --all --force
          df -h /

      # The Alpine package index checksum, APK_BASE_IMAGES from
      # scripts/tool-pins.sh (as in the image job).
      - name: Read the Alpine package index
        run: |
          APK_BASE_IMAGES=$(. scripts/tool-pins.sh && printf '%s' "$BASE_IMAGE")
          export APK_BASE_IMAGES
          sum=$(scripts/apk-index-sum.sh)
          echo "APK_INDEX_SUM=$sum" >> "$GITHUB_ENV"

      # The Debian mirror of the step above, whose sum is `none` on this base.
      # scripts/apt-index-sum.sh hashes the pinned BASE_IMAGE's apt index
      # into APT_INDEX_SUM, which the integration tag hashes and whose build
      # runs `apt-get upgrade` again. An unreadable index fails the job.
      - name: Read the Debian package index
        run: |
          sum=$(scripts/apt-index-sum.sh)
          echo "APT_INDEX_SUM=$sum" >> "$GITHUB_ENV"

      # The content-addressed integration image (as in the image job).
      - name: Name the integration image
        run: echo "IT_IMAGE=$(make -s it-image)" >> "$GITHUB_ENV"

      # The job builds the image first (fresh on a trusted run), and every
      # later step runs it by ID, as in the image job; `make it-jvm-test`
      # builds nothing for an ID.
      - name: Build the integration image
        env:
          IMAGE_ID_DIR: ${{ runner.temp }}/image-ids
        run: |
          make docker-build-it IT_IMAGE="$IT_IMAGE"
          it=$(make -s it-image-id IT_IMAGE="$IT_IMAGE")
          echo "integration image $IT_IMAGE = $it"
          echo "IT_IMAGE=$it" >> "$GITHUB_ENV"
          rm -rf "$IMAGE_ID_DIR"

      # Host tuning the suite needs goes here, as in the image job.

      # No credential file; Gradle resolves
      # nothing at run time (the image's read-only cache, --offline), and the
      # integration service has no network.

      # make integration-test is the instrumented suite and needs a device or
      # emulator over adb; the runners have no device and no KVM, so it stays
      # local. This job runs
      # make it-jvm-test instead: the JVM unit suite (testDebugUnitTest, the
      # wire-compatibility vectors included) offline in the hardened
      # integration service. It proves the integration image and its
      # posture, not the on-device suites.
      - name: make it-jvm-test (integration image, JVM suite)
        run: make it-jvm-test IT_PROJECT="$IT_PROJECT" IT_IMAGE="$IT_IMAGE"

      - name: Tear down
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/gomodauth.env"
          IT_IMAGE="$IT_IMAGE" docker compose -f build/docker/devcontainer/compose.yaml -p "$IT_PROJECT" down --volumes || true

  # Soak: the integration suite looped in the
  # integration image until SOAK_MINUTES have passed, each iteration its own
  # compose stack, torn down before the next; the first red iteration fails
  # the job. workflow_dispatch only, off main pushes and off ci:full; the
  # Gate marks it `dispatch`.
  soak:
    name: Soak [integration image]
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150      # a cold image build, SOAK_MINUTES and one iteration
    env:
      SOAK_MINUTES: 30
      # it-jvm-test, the JVM suite in the hardened integration service;
      # integration-test needs a device (integration job).
      SOAK_TARGET: it-jvm-test   # a make target of the integration image
      CI_STACK_PREFIX: ${{ github.event.repository.name }}-ci-
      IT_PROJECT: ${{ github.event.repository.name }}-ci-${{ github.run_id }}-${{ github.run_attempt }}-soak
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # Mask the forge credentials before any other step (as above).
      - name: Mask the forge credentials
        run: |
          for v in GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0; do
            val=${!v:-}
            [ -n "$val" ] || continue
            echo "::add-mask::$val"
            case $val in *://*:*@*) t=${val#*://}; t=${t%%@*}; echo "::add-mask::${t#*:}" ;; esac
          done

      # A hosted runner is a fresh VM per job, so nothing removed here is
      # shared. The host's .NET, Android SDK and GHC go (the stages use the
      # images' own JDK and SDK), and the preloaded images with them.
      - name: Free runner disk
        if: ${{ runner.environment == 'github-hosted' }}
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          docker image prune --all --force
          df -h /

      # The Alpine package index checksum, APK_BASE_IMAGES from
      # scripts/tool-pins.sh (as in the image job).
      - name: Read the Alpine package index
        run: |
          APK_BASE_IMAGES=$(. scripts/tool-pins.sh && printf '%s' "$BASE_IMAGE")
          export APK_BASE_IMAGES
          sum=$(scripts/apk-index-sum.sh)
          echo "APK_INDEX_SUM=$sum" >> "$GITHUB_ENV"

      # The Debian mirror of the step above, whose sum is `none` on this base.
      # scripts/apt-index-sum.sh hashes the pinned BASE_IMAGE's apt index
      # into APT_INDEX_SUM, which the integration tag hashes and whose build
      # runs `apt-get upgrade` again. An unreadable index fails the job.
      - name: Read the Debian package index
        run: |
          sum=$(scripts/apt-index-sum.sh)
          echo "APT_INDEX_SUM=$sum" >> "$GITHUB_ENV"

      # The content-addressed integration image (as in the image job).
      - name: Name the integration image
        run: echo "IT_IMAGE=$(make -s it-image)" >> "$GITHUB_ENV"

      # The job builds the image first (fresh on a trusted run), and every
      # later step runs it by ID, as in the image job; `make it-jvm-test`
      # builds nothing for an ID.
      - name: Build the integration image
        env:
          IMAGE_ID_DIR: ${{ runner.temp }}/image-ids
        run: |
          make docker-build-it IT_IMAGE="$IT_IMAGE"
          it=$(make -s it-image-id IT_IMAGE="$IT_IMAGE")
          echo "integration image $IT_IMAGE = $it"
          echo "IT_IMAGE=$it" >> "$GITHUB_ENV"
          rm -rf "$IMAGE_ID_DIR"

      # Host tuning the suite needs goes here, as in the image job.

      # No credential file (as in the integration job).

      - name: Soak (integration suite, looped)
        run: |
          deadline=$(( $(date +%s) + SOAK_MINUTES * 60 ))
          i=0
          while [ "$(date +%s)" -lt "$deadline" ]; do
            i=$((i + 1))
            p="$IT_PROJECT-$i"
            echo "$p" > "$RUNNER_TEMP/soak-project"
            echo "soak iteration $i"
            rc=0
            make "$SOAK_TARGET" IT_PROJECT="$p" IT_IMAGE="$IT_IMAGE" || rc=$?
            IT_IMAGE="$IT_IMAGE" docker compose -f build/docker/devcontainer/compose.yaml -p "$p" down --volumes || true
            if [ "$rc" -ne 0 ]; then
              echo "::error::soak iteration $i failed (exit $rc)"
              exit "$rc"
            fi
          done
          echo "soak: $i iterations in $SOAK_MINUTES min, all green"

      - name: Tear down
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/gomodauth.env"
          if [ -s "$RUNNER_TEMP/soak-project" ]; then
            IT_IMAGE="$IT_IMAGE" docker compose -f build/docker/devcontainer/compose.yaml -p "$(cat "$RUNNER_TEMP/soak-project")" down --volumes || true
          fi
          rm -f "$RUNNER_TEMP/soak-project"

  # Further stages run in the image job as steps of the same shape (one
  # `make` target in the toolchain image, `if: !cancelled()`). A suite that
  # needs its own runner or stack is a job of the integration job's shape and
  # joins CI Gate's needs list and check lines. Such a suite is full tier (the
  # integration job's `if:`, `full` in CI Gate) unless it is lint, build or
  # unit, which stay on the PR tier.
  # A job that runs only when certain paths change (the preflight job gains an
  # output for them, `optee` here) needs the image job as well, and its `if:`
  # tests an image job output that its build step sets (here `built`, which
  # the image job declares in `outputs:` when such a job is added), never
  # `needs.<job>.result` and never the preflight job's outputs alone: an `if:`
  # that read only those left the job skipped unstarted on a pull_request.
  # Reading `needs.preflight.outputs.*` in the same `if:` is fine:
  #   needs: [preflight, image]
  #   if: ${{ !cancelled() && needs.image.outputs.built == 'true' && !github.event.pull_request.draft && (github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'pull_request' && needs.preflight.outputs.optee == 'true')) }}


  # The single required check. Every job above must appear in
  # BOTH the needs list and the results check — a gate that can pass vacuously
  # is worse than no gate. Do not use join(needs.*.result); it can evaluate
  # empty and report success while jobs fail.
  # No fips job (there is no Go code); trivy runs in the image job on the
  # full tier.
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: always()
    # The job list. Add every new job here AND as a check line below.
    needs: [preflight, image, lint-gates, integration, soak]
    steps:
      - name: Fail closed on any non-success
        env:
          # The full tier is CI_FULL_TIER: every event but a PR, and a
          # PR labelled ci:full. A job marked `full` may be skipped below only
          # when it is not selected; a `pr` job may never be skipped.
          FULL_TIER: ${{ env.CI_FULL_TIER }}
          # A `dispatch` job runs on workflow_dispatch only.
          DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
          # A draft PR runs no CI, so its gate fails rather than pass on skips.
          DRAFT: ${{ github.event.pull_request.draft == true }}
        run: |
          if [ "${DRAFT}" = true ]; then
            echo "FAIL draft pull request: no CI runs on a draft. Mark it ready, then push an empty commit to start its run."
            exit 1
          fi
          BAD=0
          echo "full tier selected: ${FULL_TIER}; dispatch selected: ${DISPATCH}"
          check() { # <job> <result> <pr|full|dispatch>
            case "$2" in
              success) echo "OK   $1";;
              skipped)
                if [ "$3" = full ] && [ "${FULL_TIER}" != true ]; then
                  echo "SKIP $1 (full tier not selected)"
                elif [ "$3" = dispatch ] && [ "${DISPATCH}" != true ]; then
                  echo "SKIP $1 (dispatch only)"
                else
                  echo "FAIL $1 (skipped)"; BAD=1
                fi;;
              *) echo "FAIL $1 ($2)"; BAD=1;;
            esac
          }
          # One line per job in needs above. A job gated to the
          # full tier by its `if:` is marked full, one gated to
          # workflow_dispatch is dispatch; every other job is pr.
          check preflight   "${{ needs.preflight.result }}" pr
          check image       "${{ needs.image.result }}" pr
          check lint-gates  "${{ needs.lint-gates.result }}" pr
          check integration "${{ needs.integration.result }}" full
          check soak        "${{ needs.soak.result }}" dispatch
          exit $BAD
