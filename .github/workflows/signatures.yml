# Commit signature gate, read from the base branch: every PR commit must verify against .github/allowed_signers with its committer email as principal.
# It checks out only the base, runs nothing from the PR and fails closed.
name: Signatures

on:
  pull_request_target:
    branches: [main]
    # No draft skip: a skipped required check reads as passed, so the job runs
    # on every PR event that can change the commits or the base.
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  signatures:
    name: Signatures
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # pull_request_target checks out the base branch by default. The ref is
      # named anyway so no edit can point it at the pull request.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event_name == 'push' && github.sha || github.event.pull_request.base.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify commit signatures against .github/allowed_signers
        env:
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BEFORE: ${{ github.event.before }}
          REPO: ${{ github.repository }}
          API: ${{ github.api_url }}
          GH_TOKEN: ${{ github.token }}
        # The check lives in scripts/ci-verify-signatures.sh (tested by
        # scripts/tests/ci-verify-signatures-test.sh) and runs from the base
        # checkout above: nothing from the pull request head runs.
        run: ./scripts/ci-verify-signatures.sh
