# codex-review-template: v2 (adapted) — automated Codex peer review for pull
# requests. Source of truth: software/templates/github-actions/codex-review.yml
# in the automatethethings repo. Copied into each repo. Gitea-ONLY by design:
# GitHub remains the owner-gated manual channel (version-control.md §3), so the
# job guards itself off github.com.
#
# The `codex` runs-on label routes this job to the dedicated review runners
# (gpu-host-codex / omega-codex), whose job image bakes the codex CLI and the
# review assets, and whose config mounts the host's logged-in ~/.codex OAuth
# session. ONLY this workflow may declare `runs-on: codex` — that label
# carries the credential mount (conventions/sdlc.md).
#
# Adaptation for this repo (xkey-android, Kotlin/Android — issue #7 Tier 1):
# the template's setup-go step is omitted because there is no Go module here.
# Until a JDK 17 + Android SDK 34 runner exists (issue #7 Tier 2), the review
# is STATIC-ONLY — the reviewer reads the diff and sources but cannot build or
# run the test suites. That limitation is deliberate and recorded on #7; a
# static Codex gate restores dual sign-off, which this repo previously lacked
# entirely.

name: Codex Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    name: Codex Review
    runs-on: codex
    if: github.server_url != 'https://github.com'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Codex peer review
        env:
          REPO: ${{ github.event.repository.name }}
          PR_NUM: ${{ github.event.pull_request.number }}
          GITEA_URL: ${{ github.server_url }}
          GITEA_CODEX_TOKEN: ${{ secrets.CODEX_BOT_TOKEN }}
        run: /opt/codex-review/pr-review.sh
