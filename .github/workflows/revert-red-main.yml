# revert-red-main v1: red on main reverts the merge and puts the PR back up.
# This file is kept in step with a shared template; change both together.
#
# A PR merges on the PR tier (lint, build, unit test, race); main then runs
# the full tier. When main's full tier goes red because
# of a merge, this workflow:
#   1. opens a PR `revert/<sha12>` that reverts the merge commit onto main's
#      tip, as the repository's own agent (AGENT_TOKEN). Every change reaches
#      main through a PR: nothing is pushed to main and nothing
#      is force-pushed. automerge.yml merges it when its PR tier is green;
#   2. puts the change back up for its author, as a draft so automerge does
#      not merge it again before it is fixed. A merged PR cannot be reopened
#      on Gitea, so a directly merged PR #N comes back as a new draft PR
#      `reland/N` from its recorded head, titled "WIP: Reland #N: <title>". A
#      merge train closes the PRs it carries without merging them, so each
#      carried PR is reopened itself, its branch restored at the head the
#      train recorded and its title prefixed "WIP: ";
#   3. reopens the issues the merged PR closed, and comments on every PR it
#      touched with the failing run. Every PR it puts back up carries, as the
#      first line of its body, and every issue it reopens carries, as a
#      comment, one line naming the red run and the failed job, so nobody
#      has to find out why it came back.
#
# It reverts only a failure it can pin on the merge; anything else is left to
# a maintainer:
#   - the run is a push to main (not dispatch or a PR) whose
#     conclusion is failure, read again from the API by run id;
#   - a job failed in a step named in REVERT_STEPS, the deterministic stages.
#     security, deps-check and trivy can turn red on main with no merge at
#     fault (a new advisory, a new upstream release), so they never revert;
#     neither does a failure in a setup step (checkout, image build, reap);
#   - no failed job's log carries an INFRA_MARKERS line (a runner, Docker,
#     disk or OOM fault: a red job with no findings is a rerun);
#   - the parent commit's `CI / CI Gate (push)` is success, so main was green
#     before this merge and the merge is the culprit;
#   - the merge is not itself a revert (head branch revert/*), and main does
#     not already carry a revert of it.
# A cancelled run never reaches it (conclusion cancelled, not failure).
#
# Runs only from the base branch's definition (workflow_run), like
# automerge.yml; it fetches refs and runs no PR code. Gitea only: the
# github.com mirror takes no merges.

name: Revert Red Main

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: revert-red-main
  cancel-in-progress: false

jobs:
  revert:
    name: Revert a merge that turned main red
    if: >-
      github.server_url != 'https://github.com' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Revert, reland, report
        env:
          BOT: ${{ secrets.AGENT_TOKEN }}
          REPO_API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          GIT_URL: ${{ github.server_url }}/${{ github.repository }}.git
          SERVER: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          RED_RUN: ${{ github.event.workflow_run.id }}
          AGENT_DOMAIN: example.com
          GATE_CONTEXT: 'CI / CI Gate (push)'
          # CUSTOMIZE: the step names of the repo's deterministic stages, an
          # extended regex over ci.yml's step names. Add the repo's CUSTOMIZE
          # lint, build, unit, race and integration-class steps; never a
          # security, deps-check, trivy or setup step.
          # CUSTOMIZE (xkey-android): v1.27 split lint: `make lint` is Android
          # lint and `make lint-gates` the repository's own gates (actionlint
          # and the script tests), each a deterministic stage.
          # ci.yml's Android stages; no build tags or
          # go-objstore step, the JVM suite in place of integration-test, and
          # the runBlocking gate in place of the go-objstore one.
          REVERT_STEPS: '^(make lint|make lint-gates|make build|make coverage.*|make it-jvm-test.*|Soak.*|No runBlocking in production sources)$'
          # CUSTOMIZE (xkey-android): the closing-link grammar of automerge.yml's
          # links(), verbatim: close/fix/resolve and their -s/-d/-es/-ed forms,
          # any case, an optional colon, any whitespace before #N. The reopen
          # step and the reland copy both read it through closes(), so
          # `Fixes: #123` and `Closes  #123` are not missed.
          # scripts/closing-links-test.sh holds the fixtures and checks it
          # still matches links().
          CLOSING_LINK: '(?i)(?:^|[^A-Za-z0-9_])(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?):?\s+#([0-9]+)'
          INFRA_MARKERS: 'Cannot connect to the Docker daemon|no space left on device|signal: killed|exit status 137|exit code 137|OOMKilled|toomanyrequests|lost communication with the server|The runner has received a shutdown signal'
        run: |
          set -euo pipefail
          shopt -s inherit_errexit
          [ -n "${BOT:-}" ] || { echo "::error::AGENT_TOKEN is not set on this repository"; exit 1; }
          case "$REPOSITORY" in
            *) me="agent-${REPOSITORY#*/}" ;;
          esac
          me_email="$me@$AGENT_DOMAIN"
          # The token reaches curl as a header from a file descriptor, never
          # on its command line.
          api() { # method path [body] -> http code; body in /tmp/api.json
            curl -sS -o /tmp/api.json -w '%{http_code}' -X "$1" \
              -H @<(printf 'Authorization: token %s\n' "$BOT") -H 'Content-Type: application/json' \
              ${3:+-d "$3"} "$REPO_API$2"
          }
          die() { echo "::error::$*"; exit 1; }
          leave() { echo "not reverting: $*"; exit 0; }
          # CUSTOMIZE (xkey-android): a rerun on the same red merge resumes the
          # run and posts nothing twice. Every comment ends
          # in a marker naming the merge and the comment's kind, and is skipped
          # when the issue or PR already carries it. did and found collect what
          # this run did and what an earlier run had done, for the summary.
          did="" found=""
          # CUSTOMIZE (xkey-android): incomplete lists the recovery steps this
          # run owed and could not do: a failed reland,
          # reopen, branch push, fetch, PR or issue read, issue reopen or
          # comment. Each one is recorded and the run goes on to the next
          # item; after the summary the run exits 1, so a red recovery is
          # visible and its rerun retries what is left. Not `failed`, which
          # holds the red jobs' ids.
          incomplete=""
          noted() { # did|found item -> the item appended to that list
            printf -v "$1" '%s' "${!1}${!1:+, }$2"
          }
          comment() { # issue-or-pr kind body
            local m="<!-- revert-red-main ${short:-} $2 -->" c
            # CUSTOMIZE (xkey-android): only a read of the comments says the
            # marker is absent; a failed read posts
            # nothing, so a rerun does not post it twice.
            c=$(api GET "/issues/$1/comments") || true
            if [ "$c" != 200 ]; then
              echo "cannot read the comments of #$1 (HTTP $c)"; incomplete="$incomplete comment#$1"; return 0
            fi
            if jq -e --arg m "$m" 'any(.[]; (.body // "") | contains($m))' /tmp/api.json >/dev/null; then
              noted found "comment on #$1"; return 0
            fi
            c=$(api POST "/issues/$1/comments" "$(jq -n --arg b "$3"$'\n\n'"$m" '{body: $b}')") || true
            if [ "$c" = 201 ]; then noted did "comment on #$1"; else echo "cannot comment on #$1 (HTTP $c)"; incomplete="$incomplete comment#$1"; fi
          }
          paged() { # path out -> every page of a JSON-array endpoint (automerge.yml's)
            echo '[]' > "$2"
            local page=1 sep='?' code
            case $1 in *\?*) sep='&' ;; esac
            while :; do
              code=$(api GET "$1${sep}limit=50&page=$page")
              [ "$code" = 200 ] || die "cannot read $1 (HTTP $code)"
              [ "$(jq 'length' /tmp/api.json)" -gt 0 ] || break
              jq -s '.[0] + .[1]' "$2" /tmp/api.json > "$2.next"
              mv "$2.next" "$2"
              page=$((page + 1))
            done
          }
          headpr() { # branch -> "number state merged author" of the newest PR from it, or nothing
            jq -r --arg h "$1" '[.[] | select(.head.ref == $h)] | sort_by(.number) | last // empty
              | "\(.number) \(.state) \(.merged) \(.user.login)"' /tmp/pulls.json
          }
          # CUSTOMIZE (xkey-android): links()'s parse, over a body on stdin.
          closes() { # self -> the issue numbers the body closes, one per line
            jq -Rsr --argjson self "$1" --arg re "$CLOSING_LINK" \
              '[ scan($re) | .[0] | tonumber | select(. != $self) ] | unique | .[]'
          }

          # 1. The run, read again by id: a push to main that failed.
          [ "$(api GET "/actions/runs/$RED_RUN")" = 200 ] || die "cannot read run $RED_RUN"
          event=$(jq -r '.event // ""' /tmp/api.json)
          branch=$(jq -r '.head_branch // ""' /tmp/api.json)
          conclusion=$(jq -r '.conclusion // ""' /tmp/api.json)
          sha=$(jq -r '.head_sha // ""' /tmp/api.json)
          run_url=$(jq -r '.html_url // ""' /tmp/api.json)
          # CUSTOMIZE (xkey-android): an explicit if, not `A && B || C`, which
          # is SC2015 to shellcheck and fails `make actionlint` (run 61048).
          # Same behaviour: leave unless the run is a push and on main.
          if [ "$event" != push ] || [ "$branch" != main ]; then
            leave "run $RED_RUN is $event on $branch, not a push to main"
          fi
          [ "$conclusion" = failure ] || leave "run $RED_RUN concluded $conclusion"
          [[ $sha =~ ^[0-9a-f]{40}$ ]] || die "run $RED_RUN has no head sha"
          short=${sha:0:12}

          # 2. A deterministic stage failed, and no failed job shows an infra fault.
          [ "$(api GET "/actions/runs/$RED_RUN/jobs?limit=100")" = 200 ] || die "cannot read the jobs of run $RED_RUN"
          cp /tmp/api.json /tmp/jobs.json
          failed=$(jq -r '.jobs[] | select(.conclusion == "failure" and .name != "CI Gate") | .id' /tmp/jobs.json)
          [ -n "$failed" ] || leave "no job but CI Gate failed in run $RED_RUN"
          hit="" jobs_red=""
          for id in $failed; do
            name=$(jq -r --argjson i "$id" '.jobs[] | select(.id == $i) | .name' /tmp/jobs.json)
            jobs_red="$jobs_red${jobs_red:+, }$name"
            steps=$(jq -r --argjson i "$id" '.jobs[] | select(.id == $i) | .steps[]? | select(.conclusion == "failure") | .name' /tmp/jobs.json)
            # Every failed job's log is read, or there is no revert: an
            # unreadable log is no evidence the fault was not the runner's.
            rm -f /tmp/job.log
            if ! curl -fsS -H @<(printf 'Authorization: token %s\n' "$BOT") "$REPO_API/actions/jobs/$id/logs" -o /tmp/job.log \
               || [ ! -s /tmp/job.log ]; then
              leave "cannot read the log of job \"$name\"; a maintainer decides"
            fi
            if grep -Eq "$INFRA_MARKERS" /tmp/job.log; then
              leave "job \"$name\" shows a runner or host fault; rerun it"
            fi
            while IFS= read -r s; do
              [ -n "$s" ] || continue
              if [[ $s =~ $REVERT_STEPS ]]; then hit="$hit${hit:+, }$name: $s"; fi
            done <<< "$steps"
          done
          [ -n "$hit" ] || leave "no failed step in run $RED_RUN is a deterministic stage ($jobs_red)"

          # 3. The merge, and main green before it.
          [ "$(api GET "/git/commits/$sha")" = 200 ] || die "cannot read commit $short"
          parents=$(jq -r '.parents | length' /tmp/api.json)
          parent=$(jq -r '.parents[0].sha // ""' /tmp/api.json)
          [ -n "$parent" ] || leave "$short has no parent"
          # CUSTOMIZE (xkey-android): a status code other than 200 or 404 is a
          # failed read, never an absence: a failed read
          # of the parent's statuses or of the merge's PR fails the run, so
          # its rerun decides, and only a 404 sends the PR lookup to the
          # commit message.
          code=$(api GET "/commits/$parent/statuses?limit=100")
          [ "$code" = 200 ] || die "cannot read the statuses of ${parent:0:12} (HTTP $code)"
          gate=$(jq -r --arg c "$GATE_CONTEXT" \
            '[.[] | select(.context == $c)] | sort_by(.id) | last | .status // "none"' /tmp/api.json)
          [ "$gate" = success ] || leave "the parent ${parent:0:12} has $GATE_CONTEXT $gate, so the culprit is not proven"

          pr="" ; title=""
          code=$(api GET "/commits/$sha/pull")
          if [ "$code" = 200 ]; then
            pr=$(jq -r '.number' /tmp/api.json)
          elif [ "$code" = 404 ]; then
            [ "$(api GET "/git/commits/$sha")" = 200 ] || die "cannot read commit $short"
            pr=$(jq -r '.commit.message' /tmp/api.json | head -1 | sed -n 's/.*(#\([0-9][0-9]*\))$/\1/p')
          else
            die "cannot read the PR of $short (HTTP $code)"
          fi
          [[ $pr =~ ^[0-9]+$ ]] || leave "no PR found for $short"
          [ "$(api GET "/pulls/$pr")" = 200 ] || die "cannot read PR #$pr"
          cp /tmp/api.json /tmp/pr.json
          title=$(jq -r '.title' /tmp/pr.json)
          head_ref=$(jq -r '.head.ref' /tmp/pr.json)
          case $head_ref in revert/*) leave "#$pr is a revert; a red revert goes to a maintainer" ;; esac

          # 4. The revert, onto main's tip, in a fresh repository. Config by
          # environment keeps the token out of argv (automerge.yml's form).
          repo=/tmp/revert-repo
          rm -rf "$repo"; git init -q "$repo"
          auth=$(printf '%s:%s' "$me" "$BOT" | base64 -w0)
          export GIT_CONFIG_COUNT=3 \
            GIT_CONFIG_KEY_0=http.extraHeader GIT_CONFIG_VALUE_0="Authorization: Basic $auth" \
            GIT_CONFIG_KEY_1=core.hooksPath GIT_CONFIG_VALUE_1=/dev/null \
            GIT_CONFIG_KEY_2=commit.gpgSign GIT_CONFIG_VALUE_2=false \
            GIT_AUTHOR_NAME="$me" GIT_AUTHOR_EMAIL="$me_email" \
            GIT_COMMITTER_NAME="$me" GIT_COMMITTER_EMAIL="$me_email"
          git -C "$repo" fetch -q --no-tags "$GIT_URL" "+refs/heads/main:refs/red/main" "+refs/pull/$pr/head:refs/red/pr" \
            || die "cannot fetch main and #$pr"
          git -C "$repo" merge-base --is-ancestor "$sha" refs/red/main || leave "$short is not on main"
          # CUSTOMIZE (xkey-android): resume a partial run instead of stopping
          # at its own branch. The newest PR from
          # revert/<short>, which must be this agent's, is reused while open,
          # and owns the branch; merged, the revert is done and the run goes
          # on to the drafts and issues an earlier run may have left undone;
          # closed unmerged, it was refused and a maintainer decides. With
          # no PR, an existing revert/<short> is reused only when it is the
          # revert of this merge: one commit whose message names the merge, on
          # a parent main carried, with the tree the revert onto that parent
          # builds. Anything else by that name is never overwritten.
          paged "/pulls?state=all" /tmp/pulls.json
          rpr="" rstate="" rmerged="" rlogin=""
          read -r rpr rstate rmerged rlogin <<< "$(headpr "revert/$short")" || true
          if [ -n "$rpr" ] && [ "$rlogin" != "$me" ]; then
            die "PR #$rpr from revert/$short was opened by $rlogin, not $me; a maintainer decides"
          fi
          if [ "$rstate" = closed ] && [ "$rmerged" != true ]; then
            leave "revert PR #$rpr for $short was closed without merging; a maintainer decides"
          fi
          if [ "$rmerged" = true ]; then
            noted found "revert PR #$rpr merged"
          else
            # git's own --grep, not `git log | grep -q`: grep -q exits at the
            # first match, git dies of SIGPIPE, and pipefail makes the pipe
            # false, so the template's check never fires on a real history.
            if [ -n "$(git -C "$repo" log -1 --format=%H --grep="^This reverts commit $sha" refs/red/main)" ]; then
              leave "main already carries a revert of $short"
            fi
            mflag=(); [ "$parents" -gt 1 ] && mflag=(-m 1)
            code=$(api GET "/branches/revert/$short")
            if [ -n "$rpr" ]; then
              # Its open PR owns the branch from here: automerge may have
              # merged main into it, so its tip is not checked again.
              [ "$code" = 200 ] || die "revert PR #$rpr is open but revert/$short is gone (HTTP $code); a maintainer decides"
              noted found "branch revert/$short"
            elif [ "$code" = 200 ]; then
              git -C "$repo" fetch -q --no-tags "$GIT_URL" "+refs/heads/revert/$short:refs/red/revert" \
                || die "cannot fetch revert/$short"
              tip=$(git -C "$repo" rev-parse refs/red/revert)
              if [ "$(git -C "$repo" rev-list --parents -n 1 "$tip" | wc -w)" != 2 ] \
                 || [[ $(git -C "$repo" log -1 --format=%B "$tip") != *"This reverts commit $sha"* ]] \
                 || ! git -C "$repo" merge-base --is-ancestor "$tip^" refs/red/main \
                 || ! git -C "$repo" checkout -q --detach "$tip^" \
                 || ! git -C "$repo" revert --no-edit "${mflag[@]}" "$sha" >/tmp/revert.log 2>&1 \
                 || [ "$(git -C "$repo" rev-parse 'HEAD^{tree}')" != "$(git -C "$repo" rev-parse "$tip^{tree}")" ]; then
                die "revert/$short exists at ${tip:0:12} and is not the revert of $short onto main; not overwritten, a maintainer decides"
              fi
              noted found "branch revert/$short"
            elif [ "$code" = 404 ]; then
              git -C "$repo" checkout -q --detach refs/red/main
              if ! git -C "$repo" revert --no-edit "${mflag[@]}" "$sha" >/tmp/revert.log 2>&1; then
                comment "$pr" unclean "Main went red after this merged ($run_url: $hit), and $short does not revert cleanly onto main's tip. Left to a maintainer."
                die "$short does not revert cleanly onto main"
              fi
              git -C "$repo" push -q "$GIT_URL" "HEAD:refs/heads/revert/$short" || die "cannot push revert/$short"
              noted did "pushed revert/$short"
            else
              die "cannot read branch revert/$short (HTTP $code)"
            fi
            if [ -n "$rpr" ]; then
              noted found "revert PR #$rpr"
            else
              body=$(printf 'Reverts %s (#%s): main went red at that merge.\n\nRun: %s\nFailed: %s\nParent %s was green (%s).\n\nOpened by revert-red-main.yml. It merges on the PR tier like any PR.' \
                "$short" "$pr" "$run_url" "$hit" "${parent:0:12}" "$GATE_CONTEXT")
              code=$(api POST /pulls "$(jq -n --arg t "Revert \"$title\" (#$pr)" --arg b "$body" --arg h "revert/$short" \
                '{title: $t, body: $b, head: $h, base: "main"}')")
              [ "$code" = 201 ] || die "cannot open the revert PR (HTTP $code)"
              rpr=$(jq -r '.number' /tmp/api.json)
              echo "opened revert PR #$rpr for $short (#$pr)"
              noted did "opened revert PR #$rpr"
            fi
          fi

          # 5. Put the change back up as a draft, and reopen what it closed.
          note="Main went red after this merged: $run_url ($hit). Reverted by #$rpr."
          why="Reopened by revert-red-main.yml: run $run_url failed in $hit; reverted by #$rpr."
          carried=()
          case $head_ref in
            merge-train/*)
              # The train's head commit records "pr <n> <head>" per carried PR.
              while read -r _ n h; do carried+=("$n $h"); done < <(git -C "$repo" log -1 --format=%B refs/red/pr | grep -E '^pr [0-9]+ [0-9a-f]{40}$' || true) ;;
            *) carried=("$pr $(jq -r '.head.sha' /tmp/pr.json)") ;;
          esac
          relanded=""
          # CUSTOMIZE (xkey-android): each put-back resumes.
          # A merged PR whose reland/<n> already has a PR keeps that PR; an
          # existing reland/<n> at the recorded head is not pushed again, and at
          # another commit it is left alone. A carried PR an earlier run
          # reopened (its body carries the marker, or it is open with a WIP
          # title) is not patched again. Comments go through comment(), so each
          # kind is posted once.
          # CUSTOMIZE (xkey-android): a failed step adds to incomplete and the
          # loop goes on; only a success writes what the
          # rerun reads as done (the body's $mark, the reland PR, the open
          # issue), never a *-failed comment. `moved` and `reland-taken` are
          # refusals, left to a maintainer, not failures.
          mark="<!-- revert-red-main $short -->"
          for c in "${carried[@]}"; do
            read -r n h <<< "$c"
            [ "$(api GET "/pulls/$n")" = 200 ] || { echo "cannot read #$n; not relanded"; incomplete="$incomplete read-pr#$n"; continue; }
            cp /tmp/api.json /tmp/c.json
            ctitle=$(jq -r '.title' /tmp/c.json)
            cref=$(jq -r '.head.ref' /tmp/c.json)
            cmerged=$(jq -r '.merged' /tmp/c.json)
            if [ "$cmerged" = true ]; then
              l="" lstate=""
              read -r l lstate _ <<< "$(headpr "reland/$n")" || true
              if [ -n "$l" ]; then
                relanded="$relanded #$l"; noted found "reland PR #$l ($lstate)"
                comment "$n" relanded "$note Relanded as draft #$l."; continue
              fi
            elif jq -e --arg m "$mark" '(.body // "") | contains($m)' /tmp/c.json >/dev/null \
                 || { [ "$(jq -r '.state' /tmp/c.json)" = open ] && [[ $ctitle == WIP:* ]]; }; then
              relanded="$relanded #$n"; noted found "#$n reopened"
              comment "$n" reopened "$note Reopened as a draft; fix the failure, then drop the WIP prefix."; continue
            fi
            git -C "$repo" fetch -q --no-tags "$GIT_URL" "+refs/pull/$n/head:refs/red/c$n" || { echo "cannot fetch #$n"; incomplete="$incomplete fetch#$n"; continue; }
            [ "$(git -C "$repo" rev-parse "refs/red/c$n")" = "$h" ] || { comment "$n" moved "$note This PR's head moved from $h; not reopened."; continue; }
            if [ "$cmerged" = true ]; then
              # Merged: Gitea cannot reopen it, so a new draft PR from its head.
              # CUSTOMIZE (xkey-android): only a 404 says reland/<n> is absent
              # and may be pushed; a failed read is
              # recorded and the item skipped.
              code=$(api GET "/branches/reland/$n")
              if [ "$code" = 200 ] && [ "$(jq -r '.commit.id' /tmp/api.json)" = "$h" ]; then
                noted found "branch reland/$n"
              elif [ "$code" = 200 ]; then
                comment "$n" reland-taken "$note Its branch reland/$n exists at another commit; not relanded."; continue
              elif [ "$code" != 404 ]; then
                echo "cannot read branch reland/$n (HTTP $code)"; incomplete="$incomplete read-branch#$n"; continue
              elif git -C "$repo" push -q "$GIT_URL" "$h:refs/heads/reland/$n"; then
                noted did "pushed reland/$n"
              else
                echo "cannot push reland/$n"; incomplete="$incomplete reland-push#$n"; continue
              fi
              # CUSTOMIZE (xkey-android): every closing link closes() finds,
              # one `Closes #N` line each, not the lines one grammar matched.
              refs=""
              for i in $(jq -r '.body // ""' /tmp/c.json | closes "$n"); do refs="$refs${refs:+$'\n'}Closes #$i"; done
              cbody=$(printf '%s\n\nRelands #%s. Fix the failure, then drop the WIP prefix to merge.\n\n%s' \
                "$why" "$n" "$refs")
              code=$(api POST /pulls "$(jq -n --arg t "WIP: Reland #$n: $ctitle" --arg b "$cbody" --arg h "reland/$n" \
                '{title: $t, body: $b, head: $h, base: "main"}')")
              if [ "$code" = 201 ]; then
                l=$(jq -r '.number' /tmp/api.json); relanded="$relanded #$l"; noted did "opened reland PR #$l"
                comment "$n" relanded "$note Relanded as draft #$l."
              else
                incomplete="$incomplete reland-pr#$n"
                comment "$n" reland-failed "$note The draft reland PR could not be opened (HTTP $code)."
              fi
            else
              # Closed by the train: restore its branch at the recorded head
              # and reopen it as a draft.
              # CUSTOMIZE (xkey-android): a branch an earlier run restored at
              # the recorded head is not pushed again, so a rerun after a
              # failed reopen only reopens. A read other
              # than 200 or 404 is recorded and the item skipped, neither
              # pushed nor reopened.
              code=$(api GET "/branches/$cref")
              if [ "$code" = 200 ] && [ "$(jq -r '.commit.id' /tmp/api.json)" = "$h" ]; then
                noted found "branch $cref"
              elif [ "$code" != 200 ] && [ "$code" != 404 ]; then
                echo "cannot read branch $cref (HTTP $code)"; incomplete="$incomplete read-branch#$n"; continue
              elif ! git -C "$repo" push -q "$GIT_URL" "$h:refs/heads/$cref"; then
                incomplete="$incomplete restore#$n"
                comment "$n" restore-failed "$note Its branch $cref could not be restored at $h; not reopened."; continue
              fi
              case $ctitle in WIP:*) ;; *) ctitle="WIP: $ctitle" ;; esac
              cbody=$(printf '%s\n%s\n\n%s' "$why" "$mark" "$(jq -r '.body // ""' /tmp/c.json)")
              code=$(api PATCH "/pulls/$n" "$(jq -n --arg t "$ctitle" --arg b "$cbody" '{state: "open", title: $t, body: $b}')")
              if [ "$code" = 201 ] || [ "$code" = 200 ]; then
                relanded="$relanded #$n"; noted did "reopened #$n"
                comment "$n" reopened "$note Reopened as a draft; fix the failure, then drop the WIP prefix."
              else
                incomplete="$incomplete reopen-pr#$n"
                comment "$n" reopen-failed "$note It could not be reopened (HTTP $code)."
              fi
            fi
          done
          # CUSTOMIZE (xkey-android): the issues closes() finds, links()'s
          # grammar. An issue already open is not reopened again, and its
          # comment is posted once.
          # CUSTOMIZE (xkey-android): only a 404 from the PR endpoint makes a
          # number an issue. Gitea serves PRs on the issue
          # endpoint too, so a failed PR read would send a carried PR to the
          # issue reopen without its WIP title: it is recorded and skipped.
          for i in $(jq -r '.body // ""' /tmp/pr.json | closes "$pr"); do
            code=$(api GET "/pulls/$i")
            [ "$code" = 200 ] && continue   # a carried PR, handled above
            [ "$code" = 404 ] || { echo "cannot read #$i as a PR (HTTP $code)"; incomplete="$incomplete read-pr#$i"; continue; }
            [ "$(api GET "/issues/$i")" = 200 ] || { echo "cannot read issue #$i"; incomplete="$incomplete read-issue#$i"; continue; }
            if [ "$(jq -r '.state' /tmp/api.json)" = open ]; then
              noted found "issue #$i open"
            elif [ "$(api PATCH "/issues/$i" '{"state":"open"}')" = 201 ]; then
              noted did "reopened issue #$i"
            else
              echo "cannot reopen issue #$i"; incomplete="$incomplete reopen-issue#$i"; continue
            fi
            comment "$i" reopened "$why"
          done
          comment "$pr" "summary$relanded" "$note Back up as draft:${relanded:- none}."
          echo "reverted $short (#$pr) in #$rpr; drafts:${relanded:- none}; did: ${did:-nothing}; found done: ${found:-nothing}; failed:${incomplete:- nothing}"
          # CUSTOMIZE (xkey-android): every item was tried; a step left undone
          # fails the run, and its rerun retries it.
          if [ -n "$incomplete" ]; then
            echo "::error::recovery incomplete:$incomplete"
            exit 1
          fi
