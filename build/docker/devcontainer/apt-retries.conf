// The image builds' apt retry setting (#287). The Dockerfile copies this file
// into /etc/apt/apt.conf.d/80retries in the fetch and base stages, so every
// apt-get there and in the stages FROM base retries a transient mirror error
// (an HTTP 500 on one index or package) instead of failing the build.
// scripts/apt-retry-test.sh reads this file itself against a stub mirror.
Acquire::Retries "5";
