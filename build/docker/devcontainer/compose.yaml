# One service per devcontainer image; the Makefile sets TOOLCHAIN_IMAGE, IT_IMAGE and the user.
x-limits: &limits
  ulimits:
    memlock:
      soft: 67108864
      hard: 67108864
    core:
      soft: 0
      hard: 0

services:
  # `make docker-run CMD=...`: the source bind-mounted, Gradle's writable
  # user home on a named volume, HOME=/tmp.
  toolchain:
    image: ${TOOLCHAIN_IMAGE:-xkey-android-toolchain:set-by-make-docker-run}
    user: ${DOCKER_UID:-1000}:${DOCKER_GID:-1000}
    working_dir: /src
    environment:
      HOME: /tmp
      GRADLE_USER_HOME: /gradle-home
      # user.home and ANDROID_USER_HOME go to writable /tmp: an unknown uid has no passwd home.
      ANDROID_USER_HOME: /tmp/.android
      JAVA_TOOL_OPTIONS: -Duser.home=/tmp
    volumes:
      - ../../..:/src
      - gradle-home:/gradle-home
    <<: *limits

  # Hardened: read-only root, no network, no capabilities; Gradle runs on a /tmp copy of /src.
  integration:
    image: ${IT_IMAGE:?set by make it-image}
    user: "1000:1000"
    read_only: true
    network_mode: none
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      HOME: /tmp
      GRADLE_USER_HOME: /tmp/gradle-home
      # As for toolchain: /home/builder is read-only here, so the debug
      # keystore and every JVM's user.home go to the /tmp tmpfs.
      ANDROID_USER_HOME: /tmp/.android
      JAVA_TOOL_OPTIONS: -Duser.home=/tmp
    tmpfs:
      - /tmp:exec,mode=1777
    <<: *limits

volumes:
  gradle-home:
